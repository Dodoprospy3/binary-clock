<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>New Tab</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            background: #2b2a33;
            overflow: hidden;
        }

        #clock {
            position: absolute;

            top: 45%;
            left: 50%;

            transform: translate(-50%, -50%);

            display: grid;

            grid-template-columns: repeat(6, 28px);
            grid-template-rows: repeat(4, 28px);

            gap: 10px;
        }

        .dot {
            width: 28px;
            height: 28px;

            border-radius: 50%;

            background: #1c1b22;

            transition:
                background 0.15s ease,
                box-shadow 0.15s ease;
        }

        .on {
            background: #fff;

            box-shadow:
                0 0 5px #fff,
                0 0 12px rgba(255, 255, 255, 0.65),
                0 0 20px rgba(255, 255, 255, 0.3);
        }
    </style>
</head>

<body>

    <div id="clock"></div>

    <script>
        function updateClock() {
            const now = new Date();

            /*
                JavaScript automatically uses the computer's
                local timezone.

                Example:
                Kuwait  → Kuwait time
                Egypt   → Egypt time
                Japan   → Japan time
                USA     → local US time
            */

            let hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();

            /*
                Convert 24-hour time to 12-hour time.

                00 → 12
                01 → 1
                ...
                11 → 11
                12 → 12
                13 → 1
                ...
                23 → 11
            */

            hours = hours % 12 || 12;

            /*
                Six decimal digits:

                H H M M S S

                Example:

                12:34:56

                becomes:

                [1, 2, 3, 4, 5, 6]
            */

            const digits = [
                Math.floor(hours / 10),
                hours % 10,

                Math.floor(minutes / 10),
                minutes % 10,

                Math.floor(seconds / 10),
                seconds % 10
            ];

            const clock = document.getElementById("clock");

            clock.innerHTML = "";

            /*
                Four binary rows:

                8
                4
                2
                1
            */

            for (let bit = 3; bit >= 0; bit--) {

                for (const digit of digits) {

                    const dot = document.createElement("div");

                    dot.classList.add("dot");

                    /*
                        Check whether this binary bit
                        is active for the current digit.
                    */

                    if ((digit >> bit) & 1) {
                        dot.classList.add("on");
                    }

                    clock.appendChild(dot);
                }
            }
        }


        /*
            Update immediately.
        */

        updateClock();


        /*
            Synchronize updates with the real beginning
            of each second.

            This avoids starting the interval at something
            like 12:34:56.743 and updating at .743 every second.
        */

        function startClock() {

            const now = new Date();

            const millisecondsUntilNextSecond =
                1000 - now.getMilliseconds();

            setTimeout(() => {

                updateClock();

                /*
                    Once synchronized, update every second.
                */

                setInterval(updateClock, 1000);

            }, millisecondsUntilNextSecond);
        }

        startClock();
    </script>

</body>
</html>
